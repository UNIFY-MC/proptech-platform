<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V4 Energia · PropTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // FE-010: aplicar tema antes do React carregar (chave unificada 'proptech-theme')
      // Fallback para legacy 'v1theme' com migração transparente
      (function() {
        var t = localStorage.getItem('proptech-theme');
        if (!t) {
          t = localStorage.getItem('v1theme') || 'light';
          if (t !== 'light') localStorage.setItem('proptech-theme', t);
          localStorage.removeItem('v1theme');
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
