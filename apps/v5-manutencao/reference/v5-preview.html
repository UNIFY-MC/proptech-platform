  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none">{p[n]}</svg>;
};

const BNav = ({active, go, variant="orig"}) => {

    <div style={{display:"flex",borderTop:`1px solid ${C.border}`,background:"#fff"}}>
      {tabs.map((item,i) => {
        if (!item) return (
          <div key="fab" style={{flex:1,display:"flex",justifyContent:"center",alignItems:"center",paddingBottom:6}}>
            <div onClick={()=>go(99)} style={{width:48,height:48,borderRadius:"50%",background:C.greenLt,display:"flex",alignItems:"center",justifyContent:"center",marginTop:-20,boxShadow:"0 4px 12px rgba(82,183,136,.4)",cursor:"pointer"}}>
