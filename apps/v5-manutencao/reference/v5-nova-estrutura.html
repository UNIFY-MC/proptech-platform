<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V5 — Nova estrutura com Subscrição</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#d8d8d6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:12px}
button,input{font-family:inherit;border:none;background:none;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}
.scrollH{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const {useState} = React;

const C = {
  green:"#1B4332",greenMid:"#2D6A4F",greenLt:"#52B788",greenXl:"#D8F3DC",
  blue:"#185FA5",purple:"#534AB7",purpleDk:"#26215C",
  amber:"#854F0B",amberLt:"#FAEEDA",red:"#A32D2D",redLt:"#FCEBEB",
  border:"#e5e5e3",bg:"#f5f5f3",text:"#111",textS:"#555",textT:"#999",
  gold:"#D4A72C",goldLt:"#FFF4D6",coral:"#E76F51",coralLt:"#FDE4DC"
};

const SBar = () => (
  <div style={{background:C.green,padding:"10px 16px 8px",display:"flex",justifyContent:"space-between"}}>
    <span style={{color:"#fff",fontSize:12,fontWeight:700}}>9:41</span>
    <span style={{color:"rgba(255,255,255,.7)",fontSize:11}}>●●● WiFi 100%</span>
  </div>
);

/* ═══════════════════════════════════════════════
   BNAV NOVO — Início · Serviços · FAB · Casa · Pedidos
═══════════════════════════════════════════════ */
const BNav = ({active,go}) => (
  <div style={{display:"flex",borderTop:`1px solid ${C.border}`,background:"#fff"}}>
    {[
      ["Início",0,"🏠"],
      ["Serviços",1,"🛠️"],
      null,
      ["Casa",3,"🏡"],
      ["Pedidos",4,"📋"]
    ].map((it,i)=>{
      if(!it) return (
        <div key="fab" style={{flex:1,display:"flex",justifyContent:"center",alignItems:"center",paddingBottom:6}}>
          <div onClick={()=>go(99)} style={{width:52,height:52,borderRadius:"50%",background:`linear-gradient(135deg,${C.greenLt},${C.greenMid})`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",marginTop:-22,boxShadow:"0 6px 18px rgba(82,183,136,.5)",cursor:"pointer",fontSize:20,color:"#fff",fontWeight:700}}>
            <span style={{fontSize:18,lineHeight:1}}>✨</span>
            <span style={{fontSize:7,marginTop:1,letterSpacing:.3}}>PEDIR</span>
          </div>
        </div>
      );
      const [label,idx,ic]=it, on=active===idx;
      return (
        <div key={label} onClick={()=>go(idx)} style={{flex:1,padding:"8px 2px 6px",textAlign:"center",cursor:"pointer"}}>
          <div style={{fontSize:20,marginBottom:2,filter:on?"none":"grayscale(1) opacity(.5)"}}>{ic}</div>
          <div style={{fontSize:10,color:on?C.greenLt:"#bbb",fontWeight:on?700:400}}>{label}</div>
        </div>
      );
    })}
  </div>
);
