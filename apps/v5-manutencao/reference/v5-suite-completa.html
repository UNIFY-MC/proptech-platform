<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
body { background: #e5e5e3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 14px 8px; gap: 12px; }
button, input, select, textarea { font-family: inherit; border: none; background: none; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pill { font-size: 12px; padding: 7px 14px; border-radius: 16px; cursor: pointer; font-weight: 600; border: 1px solid #e5e5e3; background: #fff; color: #555; }
.pill.on-dark { border-color: #1a1a2e; background: #1a1a2e; color: #fff; }
.pill.on-green { border-color: #1B4332; background: #1B4332; color: #fff; }
.pill.on-copper { border-color: #C17E3A; background: #C17E3A; color: #fff; }
.pill.on-purple { border-color: #534AB7; background: #534AB7; color: #fff; }

.sb-client .logo-box { background: #52B788; color: #1B4332; }

.logo-title { font-size: 12px; font-weight: 700; }
.logo-sub { font-size: 9px; color: rgba(255,255,255,.5); letter-spacing: .3px; }
.nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-gt { font-size: 9px; color: rgba(255,255,255,.35); font-weight: 700; letter-spacing: .8px; padding: 8px 18px 5px; }

.nav-ic { font-size: 14px; }
.nav-badge { margin-left: auto; font-size: 9px; padding: 1px 6px; border-radius: 3px; font-weight: 700; background: rgba(255,255,255,.15); }
.user-card { padding: 10px 16px; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 10px; }

.kpi-l { font-size: 9px; color: #999; text-transform: uppercase; letter-spacing: .3px; font-weight: 700; }
.kpi-v { font-size: 22px; font-weight: 700; margin-top: 4px; }

.tbl-row:hover { background: #fafaf8; }

.badge { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 700; display: inline-block; }
.b-red { background: #FCEBEB; color: #A32D2D; }

.b-grn { background: #D8F3DC; color: #1B4332; }

function TopBar({ role, view }) {
  const titles = {
    admin: {0:["DASHBOARD · OPERAÇÕES","Cockpit V5 Manutenção"],1:["UTILIZADORES","Gestão de contas"]},
    client: {0:["CASA PRINCIPAL · COIMBRA","Bom dia Maria 👋"],2:["DOCUMENTOS","Cofre · 234 MB"]},
    pro: {0:["AGENDA","Semana 17 · 22 Abr"],3:["DASHBOARD","Vista financeira"]},
    copilot: {0:["BRIEFING SEMANAL","24 Abr · 42 edifícios"],1:["ATAS IA","Gerar · rever · enviar"],2:["ANÁLISE ORÇAMENTOS","Comparador IA"]}
  };
  const def = titles[role][Object.keys(titles[role])[0]];
  const t = titles[role]?.[view] || def;
  return (
    <div className="topbar">
      <div>
        <div className="topbar-label">{t[0]}</div>
        <div className="topbar-title">{t[1]}</div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        {role==="copilot" && <button className="btn btn-purple">+ Nova análise IA</button>}
        {role==="admin" && <button className="btn btn-dark">Exportar</button>}
        {role==="client" && <button className="btn btn-green">+ Pedir serviço</button>}
        {role==="pro" && <button className="btn btn-copper">+ Fatura</button>}
      </div>
    </div>
  );
}

function App() {
  const [role, setRole] = useState("admin");
  const [activeIdx, setActiveIdx] = useState({admin:0, client:0, pro:0, copilot:0});
  const setActive = (idx) => setActiveIdx(prev => ({...prev, [role]: idx}));
  const ai = activeIdx[role];

  const render = () => {
    if (role === "admin") return ai === 1 ? <AdminUsers/> : <AdminDashboard/>;
    if (role === "client") return ai === 2 ? <ClientDocs/> : <ClientOverview/>;
    if (role === "pro") return ai === 0 ? <ProAgenda/> : <ProDashboard/>;
    if (role === "copilot") {
      if (ai === 1 || ai === 2) return <CopilotAtas/>;
      if (ai >= 4) return <CopilotPlaceholder t="Em construção"/>;
      return <CopilotBriefing/>;
    }
  };

  return (
    <React.Fragment>
      <div className="pills">
        <div className={"pill " + (role==="admin"?"on-dark":"")} onClick={() => setRole("admin")}>Admin ERP/CRM</div>
        <div className={"pill " + (role==="client"?"on-green":"")} onClick={() => setRole("client")}>Cliente Desktop</div>
        <div className={"pill " + (role==="pro"?"on-copper":"")} onClick={() => setRole("pro")}>Prestador Pro</div>
        <div className={"pill " + (role==="copilot"?"on-purple":"")} onClick={() => setRole("copilot")}>✨ V2 Copilot (novo)</div>
      </div>
      <div className="app">
        <Sidebar role={role} active={ai} setActive={setActive}/>
        <div className="main">
          <TopBar role={role} view={ai}/>
          {render()}
        </div>
      </div>
      <div className="footer-info">
        <b>Clica nos itens do menu lateral</b> · Admin (Dashboard+Utilizadores) · Cliente (Visão geral+Documentos) · Prestador (Agenda+Dashboard) · V2 Copilot (Briefing+Atas/Análise)
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
