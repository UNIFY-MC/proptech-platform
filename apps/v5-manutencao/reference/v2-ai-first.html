.logo-title { font-size: 12px; font-weight: 700; }

.ask-hero-t { font-size: 10px; color: #FFD166; font-weight: 700; letter-spacing: .5px; }

.pa-label { font-size: 9px; color: #FFD166; font-weight: 700; letter-spacing: .5px; margin-bottom: 4px; }
.pa-title { font-size: 13px; font-weight: 700; margin-bottom: 9px; }

.pa-stat { background: rgba(255,255,255,.08); border-radius: 7px; padding: 8px 10px; }
.pa-stat-l { font-size: 9px; color: rgba(255,255,255,.6); font-weight: 700; letter-spacing: .3px; }
.pa-stat-v { font-size: 16px; font-weight: 700; margin-top: 2px; }

.inbox-ctr { display: flex; height: 100%; }

.inbox-filter { padding: 10px 16px; display: flex; gap: 6px; border-bottom: 1px solid #e5e5e3; background: #fff; flex-wrap: wrap; }

.inb-chip.on { background: #534AB7; color: #fff; border-color: #534AB7; font-weight: 700; }
.inb-item { padding: 11px 16px; border-bottom: 1px solid #e5e5e3; cursor: pointer; display: flex; gap: 10px; }

.inb-ic { font-size: 18px; flex-shrink: 0; }

.inb-time { font-size: 9px; color: #999; flex-shrink: 0; margin-left: 6px; }
.inb-sub { font-size: 10.5px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }

.inb-tag { font-size: 9px; padding: 1px 6px; border-radius: 3px; font-weight: 700; letter-spacing: .2px; }
.detail-header { background: #fff; border: 1px solid #e5e5e3; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.detail-from { font-size: 13px; font-weight: 700; }
.detail-meta { font-size: 10px; color: #999; margin-top: 3px; }
.detail-subj { font-size: 14px; font-weight: 700; margin-top: 10px; font-family: Georgia, serif; }
.detail-body { font-size: 11.5px; color: #555; line-height: 1.6; margin-top: 8px; }
.ai-suggestion { background: linear-gradient(135deg,#26215C,#534AB7); color: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.ai-sug-lbl { font-size: 9px; color: #FFD166; font-weight: 700; letter-spacing: .5px; margin-bottom: 5px; }
.ai-sug-t { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
.ai-sug-txt { font-size: 11px; line-height: 1.5; color: rgba(255,255,255,.85); }
.ai-sug-response { background: rgba(0,0,0,.2); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 11px; line-height: 1.6; }
.ai-sug-actions { display: flex; gap: 7px; margin-top: 10px; }
.ai-sug-btn { padding: 6px 11px; border-radius: 6px; font-size: 10.5px; font-weight: 700; cursor: pointer; }
.ai-sug-btn-y { background: #FFD166; color: #0a0a14; }
.ai-sug-btn-n { background: rgba(255,255,255,.15); color: #fff; }

.footer-info { font-size: 10px; color: #999; text-align: center; max-width: 720px; line-height: 1.5; }
</style>
</head>

<script type="text/babel">
const { useState } = React;

    { t: "Financeiro", items: [["💰","Quotas"],["🧾","Faturação"],["📊","Fundo reserva"]] }

  let idx = -1;
  return (
    <div className="sidebar">

                <div className="inb-sub">{it.sub}</div>
                <div className="inb-tags">
                  {it.tags.map(([t,c],j) => (
                    <span key={j} className={"inb-tag " + c}>{t}</span>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>
        <div className="inbox-detail">
          <div className="detail-header">
            <div className="detail-from">{cur.from}</div>
            <div className="detail-meta">Recebido {cur.time} · {cur.ic === "📧" ? "email" : cur.ic === "🚨" ? "sistema" : "plataforma"}</div>
            <div className="detail-subj">{cur.sub}</div>
            <div className="detail-body">
              {selected === 0 && "Boa tarde. Não consigo pagar a quota de Maio este mês por dificuldades pessoais. Posso pagar até ao dia 20? Obrigado."}
              {selected === 1 && "Fatura de limpeza geral · Condomínio Palmeira · Abril 2026. Valor: 420€ IVA incluído. Vencimento: 30 Abril 2026. NIF: 501234567. IA detectou que está dentro do histórico do prestador (-5% vs média 12m)."}
              {selected === 2 && "Olá, tenho uma infiltração no meu teto que começou esta manhã. Vem do apartamento de cima. Já está a escorrer água pela parede. Precisam de intervir urgentemente."}
              {selected === 3 && "Apresentamos proposta para pintura integral da fachada Ed. Palmeira. Inclui preparação, tinta exterior 80L e mão de obra. Total: 9.400€ IVA incluído. Andaimes incluídos."}
              {selected > 3 && "Conteúdo resumido pela IA. Clica para ver o original."}
            </div>
          </div>

          <div className="ai-suggestion">
            <div className="ai-sug-lbl">✨ SUGESTÃO IA · RESPOSTA RASCUNHADA</div>
            <div className="ai-sug-t">
              {selected === 0 && "Aceitar plano de pagamento + registar"}
              {selected === 1 && "Validar e aprovar para pagamento"}
              {selected === 2 && "Escalar para técnico 24h + notificar piso superior"}
              {selected === 3 && "Proposta competitiva · recomendo adjudicar"}
              {selected > 3 && "Ação sugerida"}
            </div>
            <div className="ai-sug-txt">
              {selected === 0 && "Baseado em histórico: condómino sempre paga antes do atraso (3 anos). Sugere-se aceitar com registo no histórico. Esta decisão está dentro da tua alçada."}
              {selected === 1 && "Fatura está coerente com histórico (-5% vs média 12m). Já validada contra orçamento anual (rúbrica limpeza geral). Faltam 120€ para exceder orçamento mensal."}
              {selected === 2 && "Urgência detectada por palavras-chave + sistema identificou situação semelhante no Ed. Palmeira em Jan 2025. Técnico João Silva (histórico do condomínio) tem disponibilidade em 90min."}
              {selected === 3 && "Análise comparativa: PintarJá melhor preço efectivo vs ServiTech (8.200€ que não inclui andaimes = 9.400€ real) e ObraLda (8.150€ sem remoção resíduos)."}
              {selected > 3 && "Revê e aprova quando quiseres."}
            </div>
            <div className="ai-sug-response">
              {selected === 0 && <><b>Rascunho da resposta:</b><br/>"Caro Sr. Silva, compreendemos a situação. Aceitamos o pagamento da quota de Maio até dia 20. Sem acréscimo de juros desta vez. Cumprimentos, AdminCondo Lda."</>}
              {selected === 1 && <><b>Workflow automático pronto:</b><br/>• Atribuir à rúbrica "Limpeza geral · Ed. Palmeira"<br/>• Validar NIF e retenção<br/>• Agendar pagamento para 29 Abril<br/>• Enviar para contabilidade</>}
              {selected === 2 && <><b>Plano de ação:</b><br/>• Contactar João Silva (1 clique)<br/>• Notificar apartamento 4º andar (email pronto)<br/>• Criar ticket + fotos solicitadas à condómina<br/>• Responder à Maria com ETA</>}
              {selected === 3 && <><b>Recomendação:</b> adjudicar à PintarJá. Gerar contrato automaticamente com base no template assembleia 2023? Convocar reunião extraordinária para aprovação (prazo legal)?</>}
              {selected > 3 && "Sugestão em processamento..."}
            </div>
            <div className="ai-sug-actions">
              <button className="ai-sug-btn ai-sug-btn-y">✓ Aprovar e executar</button>
              <button className="ai-sug-btn ai-sug-btn-n">Editar antes</button>
              <button className="ai-sug-btn ai-sug-btn-n">Rejeitar</button>
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ═══════ V2 ASK (natural language) ═══════ */

  const [query, setQuery] = useState("Mostra-me os condóminos em atraso há mais de 30 dias, ordenados por valor em dívida");
  const [showResult, setShowResult] = useState(true);

        <div className="ask-hero-s">Pergunta sobre qualquer edifício, condómino, fatura, obra, histórico. Em português.</div>
        <div className="ask-main-box">
          <span className="ask-main-ic">✨</span>

      {showResult && (

              </thead>

                <tr><td><b>Sofia Martins</b></td><td>Quinta Arcos · 1A</td><td>64 dias</td><td style={{color:"#A32D2D",fontWeight:700}}>985€</td><td style={{fontSize:10,color:"#999"}}>1º atraso</td></tr>
                <tr><td><b>Pedro Ferreira</b></td><td>Oceano · 5C</td><td>52 dias</td><td style={{fontWeight:700}}>820€</td><td style={{fontSize:10,color:"#999"}}>2 atrasos 12m</td></tr>
                <tr><td><b>Ana Rodrigues</b></td><td>Central · 2A</td><td>45 dias</td><td style={{fontWeight:700}}>710€</td><td style={{fontSize:10,color:"#999"}}>novo condómino</td></tr>
                <tr><td><b>Ricardo Lopes</b></td><td>Palmeira · 6D</td><td>38 dias</td><td style={{fontWeight:700}}>620€</td><td style={{fontSize:10,color:"#999"}}>1º atraso</td></tr>
                <tr><td><b>Carla Santos</b></td><td>Riverside · 8B</td><td>33 dias</td><td style={{fontWeight:700}}>495€</td><td style={{fontSize:10,color:"#999"}}>1º atraso</td></tr>
              </tbody>
            </table>
            <div style={{background:"#EEEDFE",borderRadius:7,padding:"10px 12px",marginTop:12,fontSize:10.5,color:"#26215C",lineHeight:1.5}}>
              <b>💡 Insight IA:</b> 4 dos 6 condóminos são 1º atraso · A IA recomenda <b>email amigável com plano de pagamento</b> para estes (taxa de sucesso histórica 87%). Para os 2 reincidentes (Oliveira e Ferreira), sugere-se carta registada e notificação legal.

          {[

function Placeholder({ t }) {
  return (
    <div style={{padding:"60px 22px",textAlign:"center"}}>
      <div style={{fontSize:42,marginBottom:10}}>✨</div>
      <div style={{fontSize:16,fontWeight:700,fontFamily:"Georgia, serif"}}>{t}</div>
      <div style={{fontSize:11,color:"#999",marginTop:8,maxWidth:500,margin:"8px auto 0",lineHeight:1.6}}>Vista não implementada neste protótipo. Os 3 ecrãs principais (Command Center, Smart Inbox, V2 Ask) demonstram a filosofia AI-first que proponho para integrar com o V2 que já tens.</div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState(0);
  const render = () => {
    if (active === 0) return <CommandCenter/>;
    if (active === 1) return <SmartInbox/>;
    if (active === 2) return <V2Ask/>;
    return <Placeholder t="Em construção"/>;
  };
  return (
    <React.Fragment>
      <div className="pills">
        <div className={"pill " + (active===0?"on":"")} onClick={() => setActive(0)}>⚡ Command Center</div>
        <div className={"pill " + (active===1?"on":"")} onClick={() => setActive(1)}>📥 Smart Inbox</div>
        <div className={"pill " + (active===2?"on":"")} onClick={() => setActive(2)}>✨ V2 Ask</div>
      </div>
      <div className="app">
        <Sidebar active={active} setActive={setActive}/>
        <div className="main">
          {render()}
        </div>
      </div>
      <div className="footer-info">
        3 ecrãs-chave da filosofia AI-first: <b>Command Center</b> (briefing + action cards) · <b>Smart Inbox</b> (caixa unificada com IA a sugerir resposta) · <b>V2 Ask</b> (perguntas em linguagem natural, inspirado em MRI Ask Agora)
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
