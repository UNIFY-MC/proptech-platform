<!DOCTYPE html>

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<body>
<div id="root"></div>

const C = {

// ── STATUS BAR
const SBar = ({dark}) => (
  <div style={{background:dark?"#0a0a08":C.green,padding:"10px 16px 8px",display:"flex",justifyContent:"space-between"}}>

    <span style={{color:"rgba(255,255,255,.7)",fontSize:11}}>●●● WiFi 100%</span>
  </div>
);

// ── BNAV
const BNav = ({active,go}) => (
  <div style={{display:"flex",borderTop:`1px solid ${C.border}`,background:"#fff"}}>
    {[["Início",0,"🏠"],["Casa",1,"🏡"],null,["Pedidos",3,"📋"],["Perfil",4,"👤"]].map((it,i)=>{
      if(!it) return (
        <div key="fab" style={{flex:1,display:"flex",justifyContent:"center",alignItems:"center",paddingBottom:6}}>
          <div onClick={()=>go(99)} style={{width:48,height:48,borderRadius:"50%",background:C.greenLt,display:"flex",alignItems:"center",justifyContent:"center",marginTop:-20,boxShadow:"0 4px 12px rgba(82,183,136,.4)",cursor:"pointer",fontSize:22,color:"#fff"}}>✨</div>

      );
      const [label,idx,ic]=it, on=active===idx;
      return (
        <div key={label} onClick={()=>go(idx)} style={{flex:1,padding:"8px 2px 6px",textAlign:"center",cursor:"pointer"}}>
          <div style={{fontSize:20,marginBottom:2,filter:on?"none":"grayscale(1) opacity(.5)"}}>{ic}</div>
          <div style={{fontSize:10,color:on?C.greenLt:"#bbb",fontWeight:on?700:400}}>{label}</div>
        </div>
      );
